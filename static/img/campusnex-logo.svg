<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background subtle glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Primary Blue-Cyan Gradient -->
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Secondary Teal-Cyan Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Neural Glow Filter -->
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Glow Circle -->
  <circle cx="60" cy="60" r="54" fill="url(#bgGlow)"/>

  <!-- Outer Architectural Neural Shield (Hex-Apex Form) -->
  <polygon points="60,10 102,32 102,88 60,110 18,88 18,32" 
           fill="#0f172a" 
           stroke="url(#nexusGrad)" 
           stroke-width="3" 
           stroke-linejoin="round"/>

  <!-- Campus Building / Pediment Geometry (Stylized Architecture) -->
  <!-- Triangular Roof Pediment -->
  <polygon points="60,24 88,40 32,40" 
           fill="none" 
           stroke="url(#nexusGrad)" 
           stroke-width="2.5" 
           stroke-linejoin="round"/>
  
  <!-- Central Location Beacon / Neural Node (Apex) -->
  <circle cx="60" cy="24" r="4.5" fill="#38bdf8" filter="url(#nodeGlow)"/>

  <!-- 3 Campus Columns morphing into Neural Bus Lines -->
  <!-- Left Pillar -->
  <line x1="40" y1="42" x2="40" y2="76" stroke="url(#nexusGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="40" cy="76" r="3.5" fill="#06b6d4"/>

  <!-- Center Pillar / Location Axis -->
  <line x1="60" y1="42" x2="60" y2="66" stroke="url(#tealGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Right Pillar -->
  <line x1="80" y1="42" x2="80" y2="76" stroke="url(#nexusGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="80" cy="76" r="3.5" fill="#06b6d4"/>

  <!-- Neural Interconnect Network Lines -->
  <line x1="40" y1="76" x2="60" y2="86" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="80" y1="76" x2="60" y2="86" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="40" y1="52" x2="60" y2="66" stroke="#06b6d4" stroke-width="1.8" opacity="0.8"/>
  <line x1="80" y1="52" x2="60" y2="66" stroke="#06b6d4" stroke-width="1.8" opacity="0.8"/>

  <!-- Central Nexus AI Node (Location Pin & Brain Center) -->
  <circle cx="60" cy="86" r="6" fill="#2563eb" stroke="#38bdf8" stroke-width="2" filter="url(#nodeGlow)"/>
  <circle cx="60" cy="86" r="2.5" fill="#ffffff"/>

  <!-- Bottom Foundation / Ground Slab -->
  <path d="M 32,96 L 60,102 L 88,96" fill="none" stroke="url(#tealGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Satellite / Dispatch Orbit Beacons -->
  <circle cx="28" cy="38" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="92" cy="38" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="60" cy="66" r="3" fill="#10b981" filter="url(#nodeGlow)"/>
</svg>
